name: HOSE Daily Screener and Email

on:
  schedule:
    # 16:00 chiều giờ Việt Nam (GMT+7) tương ứng 09:00 UTC hằng ngày
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl numpy

      - name: Run Master Screener & Send Email
        env:
          MY_EMAIL: nguyenminhphap8322@gmail.com
          MAIL_PASSWORD:escn nkau jwyx wssc
        run: |
          python master_screener.py
